services:
  openmaic:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - openmaic-data:/app/data
    restart: unless-stopped

  tts-adapter:
    build:
      context: .
      dockerfile: adapter.Dockerfile
    ports:
      # Exposing port on tts-adapter not necessary
      - "3003:8000" 
    depends_on:
      - piper
    restart: unless-stopped

  piper:
    build:
      context: .
      dockerfile: piper.Dockerfile
    ports:
      - "3002:5000"
    restart: unless-stopped

volumes:
  openmaic-data:
