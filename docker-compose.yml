services:
  openmaic:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env.local
    volumes:
      # Optional: mount server-providers.yml for provider config
      # - ./server-providers.yml:/app/server-providers.yml:ro
      - openmaic-data:/app/data
    restart: unless-stopped

  tts-adapter:
    build:
      context: .
      dockerfile: adapter.Dockerfile
    ports:
      - "3008:8000"
    depends_on:
      - piper
    restart: unless-stopped

  piper:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "
      pip install piper-tts[http] &&
      python3 -m piper.download_voices en_US-lessac-medium &&
      python3 -m piper.http_server -m en_US-lessac-medium --host 0.0.0.0 --port 5000
      "
    ports:
      - "3002:5000"
    restart: unless-stopped

volumes:
  openmaic-data:
